<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CertKit Keystore</title>
<link rel="icon" type="image/png" href="{{.CertkitURL}}/favicon-128x128.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400;500;700&display=swap">
<style>
/* Colors, type and components match status_page.html. */
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --card: #ffffff;
  --text: #373c44;
  --heading: #181c25;
  --muted: #646b79;
  --line: #e7eaf0;
  --shadow: rgba(129, 145, 181, 0.18);
  --primary: #047878;
  --primary-hover: #025d5d;
  --primary-underline: rgba(4, 120, 120, 0.5);
  --on-primary: #ffffff;
  --dot-good: #00895a;
  --good: #00895a;
  --good-bg: rgba(203, 252, 225, 0.5);
  --alert-red: #f38f79;
  --alert-red-bg: #faeeeb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13171f;
    --card: #202632;
    --text: #c2c7d0;
    --heading: #dfe3eb;
    --muted: #8a93a3;
    --line: #333c4e;
    --shadow: rgba(129, 145, 181, 0.3);
    --primary: #0ab1b1;
    --primary-hover: #0ccece;
    --primary-underline: rgba(10, 177, 177, 0.5);
    --on-primary: #13171f;
    --good: #55c21e;
    --good-bg: #173806;
    --alert-red: #f06048;
    --alert-red-bg: #30130a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 "Noto Sans Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
a { color: var(--primary); text-decoration-color: var(--primary-underline); text-underline-offset: 3px; }
a:hover { color: var(--primary-hover); text-decoration-color: currentColor; }
.wrap { width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 24px; }

.topbar { border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 14px; min-height: 64px; }
.logo { display: block; height: 30px; width: auto; }
.crumb { color: var(--muted); }

main { display: flex; flex: 1; align-items: center; justify-content: center; padding: 56px 24px; }
.card {
  width: 100%;
  max-width: 540px;
  padding: 32px 36px 28px;
  border: 1px solid var(--line);
  background: var(--card);
  box-shadow: 4px 4px 0 var(--shadow);
}
.hero { display: flex; align-items: center; gap: 18px; margin-bottom: 26px; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
.dot { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--dot-good); }
h1 { margin: 0; color: var(--heading); font-size: 26px; line-height: 1.2; }
.pill { display: inline-block; margin-top: 8px; padding: 1px 10px; border-radius: 3px; background: var(--good-bg); color: var(--good); font-size: 14px; font-weight: 500; }
h2 { margin: 0 0 8px; color: var(--heading); font-size: 18px; line-height: 1.3; }
p { margin: 0 0 24px; }
.detail {
  margin: -8px 0 24px;
  padding: 10px 14px;
  border-left: 4px solid var(--alert-red);
  background: var(--alert-red-bg);
  font: inherit;
  font-size: 13px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 15px 24px;
  background: var(--primary);
  box-shadow: 4px 4px 0 var(--shadow);
  color: var(--on-primary);
  font-size: 17px;
  font-weight: 700;
  text-decoration: none;
}
.cta:hover { background: var(--primary-hover); color: var(--on-primary); }
.cta:active { box-shadow: 1px 1px 0 var(--shadow); transform: translate(3px, 3px); }
.cta:focus-visible { outline: 3px solid var(--primary-underline); outline-offset: 3px; }
.note { margin: 18px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
footer { padding-bottom: 32px; color: var(--muted); font-size: 13px; text-align: center; }

@media (max-width: 600px) {
  body { font-size: 14px; }
  .wrap { padding: 0 16px; }
  main { padding: 32px 16px; }
  .card { padding: 24px 20px 20px; }
  h1 { font-size: 22px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a href="{{.CertkitURL}}">
      <picture>
        <source srcset="{{.CertkitURL}}/images/brand/certkit-logo-dark.svg" media="(prefers-color-scheme: dark)">
        <img class="logo" src="{{.CertkitURL}}/images/brand/certkit-logo.svg" alt="CertKit">
      </picture>
    </a>
    <span class="crumb">/ keystore</span>
  </div>
</header>

<main>
  <article class="card">
    <div class="hero">
      <span class="dot" title="Running"></span>
      <div>
        <h1>Local Keystore</h1>
        <span class="pill">Running</span>
      </div>
    </div>
    <h2>{{.Heading}}</h2>
    <p>{{.Message}}</p>
    {{if .Detail}}<pre class="detail">{{.Detail}}</pre>{{end}}
    <a class="cta" href="/auth/login">{{.Button}} <span aria-hidden="true">&rarr;</span></a>
    <p class="note">Only administrators of the CertKit account that owns this keystore can log in.</p>
  </article>
</main>

<footer>
  CertKit Keystore &middot; <a href="https://github.com/certkit-io/certkit-keystore">source</a>
</footer>
</body>
</html>
